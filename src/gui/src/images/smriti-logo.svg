<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0F172A"/>
  
  <!-- Ornate S letter -->
  <g transform="translate(256,256)">
    <!-- Main S shape -->
    <path d="M-60,-80 Q-80,-100 -60,-120 Q-40,-140 0,-120 Q40,-100 60,-80 Q80,-60 60,-40 Q40,-20 0,-40 Q-40,-60 -60,-80 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Inner decorative elements -->
    <circle cx="0" cy="-60" r="8" fill="#FFFFFF"/>
    <circle cx="-20" cy="-40" r="4" fill="#FFFFFF"/>
    <circle cx="20" cy="-40" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="-20" r="6" fill="#FFFFFF"/>
    
    <!-- Lower S curve -->
    <path d="M60,40 Q80,60 60,80 Q40,100 0,80 Q-40,60 -60,40 Q-80,20 -60,0 Q-40,-20 0,0 Q40,20 60,40 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Lower decorative elements -->
    <circle cx="0" cy="60" r="8" fill="#FFFFFF"/>
    <circle cx="-20" cy="40" r="4" fill="#FFFFFF"/>
    <circle cx="20" cy="40" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="20" r="6" fill="#FFFFFF"/>
    
    <!-- Connecting ornamental lines -->
    <path d="M-40,-60 Q0,-40 40,-60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <path d="M-40,60 Q0,40 40,60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="380" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="48" font-weight="400">Smriti</text>
  <text x="256" y="420" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="16">Private AI for your documents</text>
</svg>